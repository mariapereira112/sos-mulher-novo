spring.application.name=sos-mulher-api

# =============================================================================
#  BANCO DE DADOS
#  Padrão: H2 em memória — zero configuração, roda sem instalar nada.
#
#  Para usar PostgreSQL: defina a variável de ambiente antes de rodar:
#    Windows: set SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/sos_mulher
#    Mac/Linux: export SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/sos_mulher
#
#  Para usar MySQL:
#    set SPRING_DATASOURCE_URL=jdbc:mysql://localhost:3306/sos_mulher?useSSL=false&serverTimezone=UTC
# =============================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:sos_mulher;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# =============================================================================
#  JPA / HIBERNATE
# =============================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Garante que schema.sql e data.sql rodam DEPOIS que o Hibernate cria as tabelas
spring.jpa.defer-datasource-initialization=true

# =============================================================================
#  H2 CONSOLE (visual do banco — só funciona com H2)
#  Acesse: http://localhost:8080/h2-console
#  JDBC URL: jdbc:h2:mem:sos_mulher
#  User: sa  |  Senha: (vazio)
# =============================================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =============================================================================
#  JACKSON (serialização JSON)
# =============================================================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null
